# Simpler Azure Pipelines file — use this if you prefer one stage first.
# Rename to azure-pipelines.yml (or point the pipeline at this file) after setting variables.

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Updated from lab setup (Azure for Students)
  acrLoginServer: 'codealphacr15128.azurecr.io'
  imageName: 'codealpha-webserver'
  tag: '$(Build.BuildId)'
  # Set this to your Web App name from Portal (e.g. codealphaweb15128)
  appServiceName: 'codealphaweb15128'

steps:
  - task: Docker@2
    displayName: Build and push to ACR
    inputs:
      containerRegistry: 'acr-connection'
      repository: '$(imageName)'
      command: 'buildAndPush'
      Dockerfile: 'task4-docker-webserver/Dockerfile'
      buildContext: 'task4-docker-webserver'
      tags: |
        $(tag)
        latest

  - task: AzureWebAppContainer@1
    displayName: Deploy to App Service
    inputs:
      azureSubscription: 'CodeAlpha-Azure-Connection'
      appName: '$(appServiceName)'
      containers: '$(acrLoginServer)/$(imageName):$(tag)'
